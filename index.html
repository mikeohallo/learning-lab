<style>
/* Layout: one phone-first column, the same cream page, fonts and colours as Sam's Monster Book. */
:root {
  --paper: #FFF8EC;
  --paper-deep: #F6EBD6;
  --card: #FFFFFF;
  --ink: #3A2852;
  --ink-soft: #6E5C86;
  --line: #E4D9EC;
  --coil: #2E2834;
  --pink: #EC6AA8;
  --purple: #A880D6;
  --blue: #54A6E2;
  --green: #68B242;
  --yellow: #F2C828;
  --orange: #F4882C;
  --danger: #C2410C;
  --font-display: 'Fredoka', 'Arial Rounded MT Bold', ui-rounded, system-ui, sans-serif;
  --font-body: 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius: 18px;
  --shadow: 0 2px 0 rgba(58, 40, 82, .08), 0 10px 24px rgba(58, 40, 82, .10);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--font-body); font-size: 17px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
  display: flex; flex-direction: column; gap: 18px;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
/* ---------- header ---------- */
.top { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.title {
  margin: 4px 0 0; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(30px, 8.6vw, 46px); line-height: 1.05; text-align: center; text-wrap: balance;
  letter-spacing: .5px;
}
.title span {
  display: inline-block; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill;
  text-shadow: 0 3px 0 rgba(58, 40, 82, .18);
}
.title span:nth-child(odd) { transform: rotate(-3deg); }
.title span:nth-child(even) { transform: rotate(3deg); }
/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 10px 18px; border-radius: 14px;
  font-family: var(--font-display); font-weight: 600; font-size: 18px;
  border: 2px solid var(--ink); background: var(--card); color: var(--ink);
}
.btn.primary { background: var(--ink); color: #fff; font-size: 20px; min-height: 58px; }
.btn.quiet { border-color: var(--line); }
.btn:active { translate: 0 1px; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
/* ---------- meet ---------- */
.panel { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.15; text-wrap: balance; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
/* ---------- match game ---------- */
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.level {
  border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 4px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--ink);
}
.level small { font-family: var(--font-body); font-weight: 800; font-size: 12px; color: var(--ink-soft); }
.level[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
.level[aria-pressed="true"] small { color: rgba(255, 255, 255, .8); }
@keyframes bounce { 0% { transform: rotateY(0) scale(1); } 40% { transform: rotateY(0) scale(1.12); } 70% { transform: rotateY(0) scale(.96); } 100% { transform: rotateY(0) scale(1); } }
.gamelist { display: flex; flex-direction: column; gap: 12px; }
.gametile {
  display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; text-align: left;
  border: 0; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px 12px 12px;
}
.gametile b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; }
.gametile small { display: block; color: var(--ink-soft); font-weight: 700; font-size: 15px; margin-top: 3px; line-height: 1.3; }
.gametile:active { translate: 0 1px; }
.gpic { width: 96px; height: 96px; border-radius: 16px; position: relative; overflow: hidden; display: block; }
.gamebar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: -6px; }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 6px 2px; font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--ink-soft); }
.back svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.mute { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; }
.mute svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.mute svg .cone { fill: var(--ink); }
.levels.three { grid-template-columns: repeat(3, 1fr); }
/* ---------- whack-a-monster ---------- */
.wdots { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin: -4px 0; }
.wdots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); transition: background .2s; }
.wdots i.hit { background: var(--green); }
.wdots i.miss { background: #F3C7DA; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-18px); } }
@keyframes pulse { 0%, 100% { scale: 1; } 50% { scale: 1.16; } }
@keyframes wave { 0%, 100% { transform: translateY(-14%) scale(1.25) rotate(-6deg); } 50% { transform: translateY(-20%) scale(1.25) rotate(6deg); } }
.tile { border: 0; padding: 0; background: none; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.more { margin: 8px 0 0; text-align: center; }
.more a { display: inline-flex; align-items: center; gap: 2px; padding: 8px 14px; border-radius: 999px; color: var(--ink-soft); font-family: var(--font-display); font-weight: 600; font-size: 16px; text-decoration: none; background: var(--paper-deep); }
.more svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.toast {
  position: fixed; left: 50%; translate: -50% 0; z-index: 20;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: #fff; font-weight: 800; padding: 10px 18px; border-radius: 999px;
  box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; }}
/* Letters: tracing in NSW Foundation Style (Edu NSW ACT Foundation, OFL), and spelling with letter tiles */
@font-face { font-family: 'NSW Foundation'; font-weight: 400; font-display: swap; src: url(letters/EduNSWACTFoundation.woff2) format('woff2'); }
.lpa { font-family: 'NSW Foundation', var(--font-body); color: var(--ink); }
.gpic.letterpic { background: #fff; }
.gpic.letterpic svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.gpic.letterpic .lpa { position: absolute; left: 30px; top: 6px; font-size: 76px; line-height: 1; }
.lpdot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #2FA858; box-shadow: 0 0 0 3px #fff; left: 58px; top: 38px; }
.lmodes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lmode { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 66px; border: 3px solid var(--line); border-radius: var(--radius); background: var(--card); font-family: var(--font-display); font-size: 22px; color: var(--ink); box-shadow: var(--shadow); }
.lmode[aria-pressed="true"] { border-color: var(--ink); }
.lmpic { position: relative; width: 50px; height: 50px; border-radius: 12px; background: var(--paper-deep); flex: none; }
.lmpic .lpa { position: absolute; left: 13px; top: -2px; font-size: 52px; line-height: 1; }
.lmpic .lpdot { width: 10px; height: 10px; left: 32px; top: 18px; }
.lmpic.tiles3 { display: flex; gap: 2px; align-items: center; justify-content: center; background: none; }
.lmpic.tiles3 i { font-style: normal; font-family: 'NSW Foundation', var(--font-body); font-size: 22px; width: 18px; height: 26px; line-height: 24px; border-radius: 5px; background: var(--yellow); text-align: center; }
.lmpic.tiles3 i:nth-child(2) { background: #9ED3F5; }
.lmpic.tiles3 i:nth-child(3) { background: #F7B8D6; }
.lsay { min-height: 34px; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 22px; color: var(--ink); opacity: 0; transition: opacity .25s; margin: -2px 0 -6px; }
.lsay.show { opacity: 1; }
.ltop { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.lpic { width: 80px; height: 80px; border: 0; padding: 4px; border-radius: 18px; background: var(--paper-deep); display: grid; place-items: center; }
.lpic img { width: 100%; height: 100%; object-fit: contain; }
.lpic.big { width: 150px; height: 150px; margin: 0 auto; }
.lpic.pop img { animation: bounce .7s ease both; }
.lword { font-family: 'NSW Foundation', var(--font-body); font-size: 44px; line-height: 1.1; color: var(--ink); word-break: break-word; }
.lword b { font-weight: 400; color: var(--pink); }
.lround { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; }
.lround svg { width: 26px; height: 26px; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tsvg { display: block; margin: 0 auto; width: min(100%, calc(56vh * 1000 / 1190)); aspect-ratio: 1000 / 1190; touch-action: none; user-select: none; -webkit-user-select: none; background: #fff; border-radius: 14px; }
.tsvg .track { fill: none; stroke: #ECE5F3; stroke-width: 82; stroke-linecap: round; stroke-linejoin: round; }
.tsvg .ink { fill: none; stroke: var(--pink); stroke-width: 50; stroke-linecap: round; stroke-linejoin: round; }
.tsvg .ghost { fill: none; stroke: #C6B8DA; stroke-width: 50; stroke-linecap: round; stroke-linejoin: round; }
.tsvg .tarrow { fill: #B7A8CD; }
.tsvg .start { fill: #2FA858; stroke: #fff; stroke-width: 10; }
.tsvg .start.pulse, .tsvg .pen.pulse { animation: pulse 1s ease infinite; transform-box: fill-box; transform-origin: center; }
.tsvg .num { font-family: var(--font-display); font-weight: 700; font-size: 70px; fill: var(--ink-soft); }
.tsvg .guide { stroke: #9C8BB4; stroke-width: 4; }
.tsvg .guide.dash { stroke: #C9BCDA; stroke-dasharray: 22 16; }
.tsvg .dotT { fill: #ECE5F3; }
.tsvg .dotT.done { fill: var(--pink); }
.tsvg.done .ink { stroke: #2FA858; transition: stroke .4s; }
.tsvg.done .dotT.done { fill: #2FA858; }
.lpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
.lpick button { height: 56px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); font-family: 'NSW Foundation', var(--font-body); font-size: 34px; color: var(--ink); }
.lpick button.done { background: #E2F3DA; }
.lpick button[aria-current="true"] { border-color: var(--ink); }
.slots { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.slot { width: var(--s, 76px); height: calc(var(--s, 76px) * 1.15); border-radius: 14px; border: 3px dashed #C9BCDA; display: grid; place-items: center; font-family: 'NSW Foundation', var(--font-body); font-size: calc(var(--s, 76px) * .72); line-height: 1; color: #DDD3E8; background: #fff; }
.slot.filled { border-style: solid; border-color: var(--ink); color: var(--ink); animation: bounce .45s ease both; }
.slot.say { background: #FFF1B8; }
.ltiles { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.tile { width: var(--t, 92px); height: var(--t, 92px); border-radius: 18px; border: 0; box-shadow: 0 4px 0 rgba(58, 40, 82, .25); font-family: 'NSW Foundation', var(--font-body); font-size: calc(var(--t, 92px) * .7); line-height: 1; color: var(--ink); display: grid; place-items: center; padding-bottom: 6px; }
.tile:active { translate: 0 2px; box-shadow: 0 2px 0 rgba(58, 40, 82, .25); }
.tile.used { visibility: hidden; }
.tile.nope { animation: shake2 .45s ease; }
@keyframes shake2 { 0%, 100% { translate: 0 0; } 20% { translate: -8px 0; } 40% { translate: 8px 0; } 60% { translate: -5px 0; } 80% { translate: 5px 0; } }
/* Sound hunt and First sounds: hear a sound (or see a picture) and find its letter */
.levels.two { grid-template-columns: repeat(2, 1fr); }
.lmpic.spk { display: grid; place-items: center; background: #FFE9A8; }
.lmpic.spk svg { width: 32px; height: 32px; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.lmpic.first img { position: absolute; left: 2px; top: 4px; width: 34px; height: 34px; object-fit: contain; }
.lmpic.first i { position: absolute; right: 2px; bottom: -2px; font-style: normal; font-family: 'NSW Foundation', var(--font-body); font-size: 28px; line-height: 1; width: 24px; height: 28px; text-align: center; border-radius: 6px; background: #B8E39A; }
.hq { display: grid; place-items: center; min-height: 124px; }
#huntBox.ended .hq { display: none; }
.hear { width: 112px; height: 112px; border-radius: 50%; border: 0; background: #FFE9A8; box-shadow: 0 5px 0 rgba(58, 40, 82, .2); display: grid; place-items: center; }
.hear svg { width: 60px; height: 60px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hear:active { translate: 0 2px; box-shadow: 0 3px 0 rgba(58, 40, 82, .2); }
.hear.talk svg .wave { animation: wave 1s ease infinite; }
@keyframes wave { 50% { opacity: .25; } }
.tile.yes { background: #9FDE84 !important; animation: bounce .5s ease both; }
.tile.dim { opacity: .35; }
.hend { text-align: center; display: grid; gap: 12px; justify-items: center; }
.hend .wdots i { width: 20px; height: 20px; }
@media (prefers-reduced-motion: reduce) { .tsvg .start.pulse, .tsvg .pen.pulse, .slot.filled, .tile.nope, .tile.yes, .lpic.pop img, .hear.talk svg .wave { animation: none; } .lsay { transition: none; }}
/* Numbers: Monster count and Quick look */
.ghead { display: flex; align-items: center; gap: 8px; margin: 10px 0 -2px; font-size: 22px; }
.ghead svg { width: 22px; height: 22px; }
.ghead svg rect { fill: var(--purple); }
.ghead svg circle { fill: #fff; }
.gpic.countpic { background: radial-gradient(circle at 25% 20%, #D9F2C4 0 22%, transparent 23%), #BFE6A0; }
.gpic.countpic img { position: absolute; width: 38px; height: 38px; object-fit: contain; }
.gpic.countpic i { position: absolute; width: 19px; height: 19px; border-radius: 50%; background: var(--ink); color: #fff; font: 700 12px/19px var(--font-display); text-align: center; font-style: normal; box-shadow: 0 0 0 2px #fff; }
.gpic.quickpic { background: #FFE9A8; display: grid; place-items: center; }
.gpic.quickpic .die { width: 70px; height: 70px; border-radius: 16px; background: #fff; box-shadow: 0 3px 0 rgba(58, 40, 82, .2); position: relative; }
.gpic.quickpic .die img { position: absolute; width: 25px; height: 25px; object-fit: contain; }
.npanel .h2 { text-align: center; }
.nword { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.1; color: var(--ink); }
.npanel .lsay { min-height: 48px; display: grid; place-items: center; font-size: 20px; line-height: 1.2; text-wrap: balance; margin: -4px 0 -8px; }
.cfield { position: relative; border-radius: 18px; overflow: hidden; touch-action: manipulation; background: linear-gradient(#C9EBAE, #ADDC8A); }
.cmon { position: absolute; width: var(--m); height: var(--m); margin: calc(var(--m) / -2) 0 0 calc(var(--m) / -2); border: 0; padding: 0; background: none; border-radius: 50%; }
.cmon::before { content: ''; position: absolute; inset: 4%; border-radius: 50%; transition: background .2s, box-shadow .2s; }
.cmon.done::before { background: rgba(255, 255, 255, .6); box-shadow: 0 0 0 3px var(--green); }
.cmon img { position: relative; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 3px 0 rgba(58, 40, 82, .16)); }
.cmon.pop img { animation: bounce .45s ease both; }
.cmon.again { animation: shake2 .45s ease; }
.cmon b { position: absolute; right: -5px; top: -5px; min-width: calc(var(--m) * .44); height: calc(var(--m) * .44); padding: 0 3px; border-radius: 999px; background: var(--ink); color: #fff;
  font: 700 calc(var(--m) * .3)/calc(var(--m) * .44) var(--font-display); text-align: center; box-shadow: 0 0 0 2px #fff; scale: 0; transition: scale .2s; }
.cmon.done b { scale: 1; }
.cmon b.hint { animation: hint 1s ease 2; }
@keyframes hint { 50% { scale: 1.4; background: var(--green); } }
.ntiles { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-inline: auto; }
.ntile { width: var(--t, 92px); height: var(--t, 92px); border-radius: 18px; border: 0; box-shadow: 0 4px 0 rgba(58, 40, 82, .25); font-family: var(--font-display); font-weight: 700; font-size: calc(var(--t, 92px) * .54); line-height: 1; color: var(--ink); display: grid; place-items: center; }
.ntile:active { translate: 0 2px; box-shadow: 0 2px 0 rgba(58, 40, 82, .25); }
.ntile.nope { animation: shake2 .45s ease; }
.ntile.yes { background: #9FDE84 !important; animation: bounce .5s ease both; }
.ntile.dim { opacity: .35; }
.qcard { position: relative; border-radius: 18px; overflow: hidden; background: linear-gradient(#FFF7DC, #FFE9A8); }
.qcard.two::before { content: ''; position: absolute; left: 50%; top: 12%; bottom: 22%; width: 4px; margin-left: -2px; border-radius: 2px; background: rgba(58, 40, 82, .14); }
.qmons { position: absolute; inset: 0; transition: transform .28s ease; }
.qcard.hide .qmons { transform: translateY(102%); transition-timing-function: ease-in; }
.qmon { position: absolute; width: var(--m); height: var(--m); margin: calc(var(--m) / -2) 0 0 calc(var(--m) / -2); object-fit: contain; filter: drop-shadow(0 3px 0 rgba(58, 40, 82, .16)); }
.qbush { position: absolute; left: -6%; right: -6%; bottom: -1px; height: 20%; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse at 10% 100%, #7DBF55 0 58%, transparent 60%), radial-gradient(ellipse at 37% 100%, #8CCB5E 0 62%, transparent 64%), radial-gradient(ellipse at 64% 100%, #7DBF55 0 60%, transparent 62%), radial-gradient(ellipse at 90% 100%, #8CCB5E 0 58%, transparent 60%); }
.qpeek { align-self: center; }
@media (prefers-reduced-motion: reduce) { .cmon.pop img, .cmon.again, .cmon b.hint, .ntile.nope, .ntile.yes { animation: none; } .qmons, .cmon b { transition: none; }}
</style>

<body>
<div class="app">
  <header class="top">
    <h1 class="title" id="title" aria-label="My Learning Lab"></h1>
  </header>

  <!-- HOME: the games -->
  <section id="home" class="stack" aria-label="Learning games">
    <div class="gamelist">
      <h2 class="h2 ghead" id="lettersHead"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><text x="12" y="16.6" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="14" fill="#fff">a</text></svg>Letters</h2>
      <button class="gametile" id="playLetters" type="button">
        <span class="gpic letterpic" aria-hidden="true"><svg viewBox="0 0 96 96"><path d="M0 22h96M0 74h96" stroke="#C9BCDA" stroke-width="2" stroke-dasharray="5 4"/><path d="M0 40h96M0 74h96" stroke="#9C8BB4" stroke-width="2"/></svg><span class="lpa">a</span><span class="lpdot"></span></span>
        <span><b>Letters</b><small>Trace letters and spell words</small></span></button>
      <h2 class="h2 ghead" id="numbersHead"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="8.3" cy="8.3" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="15.7" cy="15.7" r="1.9"/></svg>Numbers</h2>
      <button class="gametile" id="playCount" type="button">

<script>
// ---------------------------------------------------------------- data ----
// The Learning Lab: Letters (tracing, spelling, letter sounds) and Numbers (counting games), with the monsters from
// Sam's Monster Book as the characters. It used to be part of monsters.mikeohalloran.au.
const DEFAULT_OWNER = '';   // gift copies: change this, or link with ?for=Name
// The hosted build sets this to true: then the Letters game only shows on a device that has opened the secret
// link once (_worker.js gives it a pass cookie and blocks letters/ for everyone else). The preview always shows it.
const LETTERS_GATED = true;
const lettersOK = () => !LETTERS_GATED || /(?:^|;\s*)mb_letters_ok=1(?:;|$)/.test(document.cookie);
const N = 30;                    // the monsters' faces: faces/F01.webp to F30.webp
const COLOURS = { pink: '#EC6AA8', purple: '#A880D6', blue: '#54A6E2', green: '#68B242', yellow: '#F2C828', orange: '#F4882C' };
const pad = n => String(n).padStart(2, '0');
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ------------------------------------------------------------- owner ------
// A gift link (?for=Max) names the lab on that device the first time it's opened.
const OWNER_KEY = 'learning-lab.owner';
try {
  const f = (new URLSearchParams(location.search).get('for') || '').trim().slice(0, 20);
  if (f && !localStorage.getItem(OWNER_KEY)) localStorage.setItem(OWNER_KEY, f);
} catch (e) {}
function ownerName() {
  let fromLink = null, saved = null;
  try { fromLink = new URLSearchParams(location.search).get('for'); saved = localStorage.getItem(OWNER_KEY); } catch (e) {}
  return (fromLink || saved || DEFAULT_OWNER || '').trim().slice(0, 20);
}
function possessive(name) { return name ? `${name}'s` : 'My'; }
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ------------------------------------------------------------- carry-over --
// Before the Learning Lab had its own site, Sam's Letters and Numbers progress was saved on the monster site, and
// only a page from that site can read it. So the first time this site opens on one of her devices, it hops there
// once (monsters.mikeohalloran.au/?handoff=learn), and that page sends the progress straight back in the address.
const CARRY = { letters: 'learning-lab.letters', numbers: 'learning-lab.numbers', sound: 'learning-lab.sound' };
function carryOver() {           // true if the page is about to hop away
  try {
    const h = location.hash;
    if (h.startsWith('#import=')) {
      const d = JSON.parse(decodeURIComponent(h.slice(8)));
      for (const [k, key] of Object.entries(CARRY)) {
        const v = d[k];
        if (typeof v !== 'string' || v.length > 20000 || localStorage.getItem(key) !== null) continue;
        if (k !== 'sound') { const o = JSON.parse(v); if (!o || typeof o !== 'object' || Array.isArray(o)) continue; }
        else if (v !== 'on' && v !== 'off') continue;
        localStorage.setItem(key, v);
      }
      if (typeof d.owner === 'string' && d.owner && !localStorage.getItem(OWNER_KEY)) localStorage.setItem(OWNER_KEY, d.owner.trim().slice(0, 20));
      localStorage.setItem('learning-lab.carried', '1');
      const to = typeof d.to === 'string' && /^[a-z]{1,12}$/.test(d.to) ? '#' + d.to : '';
      history.replaceState(null, '', location.pathname + location.search + to);
      return false;
    }
    if (location.hostname !== 'learn.mikeohalloran.au' || ownerName().toLowerCase() !== 'sam') return false;
    if (localStorage.getItem('learning-lab.carried') || localStorage.getItem(CARRY.letters) !== null) return false;
    localStorage.setItem('learning-lab.carried', '1');      // only ever once, even if the hop fails
    const u = new URL('https://monsters.mikeohalloran.au/');
    u.searchParams.set('handoff', 'learn'); u.searchParams.set('for', ownerName());
    const to = h.replace(/^#/, ''); if (/^[a-z]{1,12}$/.test(to)) u.searchParams.set('to', to);
    location.replace(u.toString());
    return true;
  } catch (e) { return false; }
}
const hopping = carryOver();     // before the games read their saved progress, so an import is what they find

// ------------------------------------------------------------- title ------
function renderTitle() {
  const text = `${possessive(ownerName())} Learning Lab`;
  const h = $('title'); h.setAttribute('aria-label', text); h.textContent = '';
  const cycle = ['green', 'blue', 'purple', 'pink', 'orange', 'yellow'];
  let k = 0;
  text.split(' ').forEach((word, wi) => {
    if (wi) h.append(' ');
    const w = document.createElement('span'); w.style.display = 'inline-block';
    w.style.transform = 'none'; w.style.webkitTextStroke = '0'; w.style.textShadow = 'none';
    for (const ch of word) {
      const s = document.createElement('span'); s.textContent = ch; s.setAttribute('aria-hidden', 'true');
      s.style.color = COLOURS[cycle[k++ % cycle.length]];
      w.append(s);
    }
    h.append(w);
  });
  document.title = text;
  try {   // the way back to the other labs carries the name along
    const u = new URL('https://play.mikeohalloran.au/');
    if (ownerName()) u.searchParams.set('for', ownerName());
    $('morePlay').href = u.toString();
  } catch (e) {}
}

// ------------------------------------------------------------- screens ---
const screens = ['home', 'lettergame', 'countgame', 'quickgame'];
const HASHES = { home: '', lettergame: '#letters', countgame: '#count', quickgame: '#quick' };
function show(id) {
  if (id !== 'lettergame') stopLetters();
  stopNumbers();
  screens.forEach(s => { $(s).hidden = s !== id; });
  try {   // keep the address in step, so #letters, #count or #quick can be bookmarked or saved to a home screen
    const h = HASHES[id] || '';
    if (location.hash !== h) history.replaceState(null, '', location.pathname + location.search + h);
  } catch (e) {}
  scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
}
function openGame(id) {
  if (id === 'lettergame') { if (lettersOK()) openLetters(); else show('home'); }
  else if (id === 'countgame') openCount();
  else if (id === 'quickgame') openQuick();
  else show('home');
}
function route() {
  const h = location.hash.toLowerCase();
  const id = Object.keys(HASHES).find(k => HASHES[k] && HASHES[k] === h);
  openGame(id || 'home');
}

// ------------------------------------------------------------- sound -----
// Every sound is made in the browser (no audio files). Off switch is remembered on the device.
const sound = (() => {
  let ctx = null, master = null, noiseBuf = null, lull = null;
  let on = true; try { on = localStorage.getItem('learning-lab.sound') !== 'off'; } catch (e) {}
  function ac() {
    if (!on) return null;
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
        ctx = new AC(); master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      return ctx;
    } catch (e) { return null; }
  }
  function noiseSrc() {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s;
  }
  function env(g, t, vol, attack, dur) {
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  }
  function tone({ f0, f1 = f0, dur = .15, type = 'sine', vol = .1, at = 0, attack = .008, out = null }) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, vol, attack, dur); o.connect(g); g.connect(out || master); o.start(t); o.stop(t + dur + .05);
  }
  function hiss({ dur = .2, kind = 'bandpass', f0 = 1000, f1 = f0, q = 1, vol = .05, at = 0, attack = .01, out = null }) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + at, s = noiseSrc(), f = c.createBiquadFilter(), g = c.createGain();
    f.type = kind; f.Q.value = q; f.frequency.setValueAtTime(f0, t); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, vol, attack, dur); s.connect(f); f.connect(g); g.connect(out || master); s.start(t); s.stop(t + dur + .05);
  }
  const NOTES = { C: 523.25, D: 587.33, E: 659.25, F: 698.46, G: 783.99, A: 880 };
  function musicBox(freq, t, out) {
    [[1, .09], [2, .018], [3, .006]].forEach(([m, v]) => {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = freq * m;
      env(g, t, v, .012, 1.7); o.connect(g); g.connect(out); o.start(t); o.stop(t + 1.8);
    });
  }
  return {
    get on() { return on; },
    set(v) { on = v; try { localStorage.setItem('learning-lab.sound', v ? 'on' : 'off'); } catch (e) {} if (!v) this.stopLullaby(); else ac(); },
    unlock() { ac(); },
    pop() { tone({ f0: 480, f1: 820, dur: .09, vol: .06 }); },
    boing() { tone({ f0: 760, f1: 170, dur: .26, type: 'triangle', vol: .16 }); hiss({ dur: .06, kind: 'lowpass', f0: 900, vol: .12, attack: .002 }); },
    grr() {
      const c = ac(); if (!c) return;
      const t = c.currentTime, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(120, t); o.frequency.linearRampToValueAtTime(85, t + .45);
      f.type = 'lowpass'; f.frequency.value = 520; lfo.frequency.value = 22; lg.gain.value = .5;
      env(g, t, .14, .03, .5); lfo.connect(lg); lg.connect(g.gain); o.connect(f); f.connect(g); g.connect(master);
      o.start(t); lfo.start(t); o.stop(t + .55); lfo.stop(t + .55);
    },
    start() { tone({ f0: 392, dur: .14, type: 'triangle', vol: .1 }); tone({ f0: 523.25, dur: .22, type: 'triangle', vol: .12, at: .16 }); },
    jingle() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone({ f0: f, dur: i === 3 ? .5 : .16, type: 'triangle', vol: .12, at: i * .13 })); },
    hop() { tone({ f0: 300, f1: 640, dur: .18, vol: .1 }); },
    fwip() { hiss({ dur: .32, f0: 700, f1: 2600, q: .8, vol: .07, attack: .05 }); },
    click() { tone({ f0: 2100, dur: .02, type: 'square', vol: .04, attack: .001 }); hiss({ dur: .03, kind: 'highpass', f0: 3000, vol: .05, attack: .001 }); },
    snore(pan = 0) {
      const c = ac(); if (!c) return;
      const t = c.currentTime, s = noiseSrc(), f = c.createBiquadFilter(), g = c.createGain(), rattle = c.createGain(), lfo = c.createOscillator(), lg = c.createGain();
      f.type = 'lowpass'; f.frequency.value = 480; lfo.frequency.value = 26; lg.gain.value = .45; rattle.gain.value = .55;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.07, t + .9); g.gain.exponentialRampToValueAtTime(.0001, t + 1.5);
      let out = master;
      if (c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = pan; p.connect(master); out = p; }
      s.connect(f); f.connect(g); g.connect(rattle); lfo.connect(lg); lg.connect(rattle.gain); rattle.connect(out);
      s.start(t); lfo.start(t); s.stop(t + 1.6); lfo.stop(t + 1.6);
      hiss({ dur: 1, kind: 'bandpass', f0: 1400, f1: 900, q: .7, vol: .018, at: 1.7, attack: .3, out });   // the soft breath out
    },
    lullaby() {   // Twinkle Twinkle Little Star, on a little music box
      const c = ac(); if (!c) return 0;
      this.stopLullaby();
      lull = c.createGain(); lull.gain.value = 1; lull.connect(master);
      const tune = 'C C G G A A G2 F F E E D D C2 G G F F E E D2 G G F F E E D2 C C G G A A G2 F F E E D D C2'.split(' ');
      const beat = .55; let t = c.currentTime + .15;
      for (const n of tune) { musicBox(NOTES[n[0]], t, lull); t += beat * (n[1] === '2' ? 2 : 1); }
      return t - c.currentTime + 1.5;
    },
    stopLullaby() {
      if (!lull || !ctx) return;
      const g = lull; lull = null;
      try { g.gain.setTargetAtTime(0, ctx.currentTime, .12); setTimeout(() => g.disconnect(), 800); } catch (e) {}
    },
    morning() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone({ f0: f, dur: .25, vol: .1, at: i * .09 })); },
    boo() {   // a friendly "boo!": a wobbly slide down
      const c = ac(); if (!c) return;
      const t = c.currentTime, o = c.createOscillator(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(230, t + .45);
      lfo.frequency.value = 9; lg.gain.value = 18; lfo.connect(lg); lg.connect(o.frequency);
      env(g, t, .14, .04, .5); o.connect(g); g.connect(master); o.start(t); lfo.start(t); o.stop(t + .55); lfo.stop(t + .55);
    },
    giggle() { [0, .1, .2, .3].forEach((at, i) => tone({ f0: 700 + i * 60, f1: 900 + i * 60, dur: .08, vol: .07, at: .45 + at })); },
    whoosh() { hiss({ dur: .6, f0: 300, f1: 1800, q: .6, vol: .08, attack: .15 }); [659.25, 880, 1318.5].forEach((f, i) => tone({ f0: f, dur: .5, vol: .05, at: .35 + i * .08 })); },
    chime() { [784, 1046.5, 1318.5].forEach((f, i) => tone({ f0: f, dur: .35, vol: .06, at: i * .07 })); },
    out() { const c = ac(); return c ? { ctx: c, master } : null; },   // for the recorded voices in Letters
  };
})();
const SPEAKER_ON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="cone" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18.2 6.5a7.6 7.6 0 0 1 0 11"/></svg>';
const SPEAKER_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="cone" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
function syncMute() {
  document.querySelectorAll('.mute').forEach(b => {
    b.innerHTML = sound.on ? SPEAKER_ON : SPEAKER_OFF;
    b.setAttribute('aria-label', sound.on ? 'Sound is on. Tap to turn it off' : 'Sound is off. Tap to turn it on');
    b.setAttribute('aria-pressed', String(!sound.on));
  });
}

const speech = (() => {          // the browser's own voice, for lines with no clip yet
  const ok = typeof window.speechSynthesis === 'object' && typeof window.SpeechSynthesisUtterance === 'function';
  let pick = null;

    try {
      const vs = speechSynthesis.getVoices();

    } catch (e) {}

    ok,
    say(text) {

        const t = setTimeout(() => fin(true), 1500 + text.length * 90);   // some browsers never say they've finished

const nvoice = (() => {

    catch (e) { avail = new Set(); }

  }
  const has = id => !!avail && avail.has(id);

    if (!bufs.has(id)) bufs.set(id, (async () => {

    preload(ids) { ids.forEach(id => has(id) && buffer(id)); },
    async say(ids, gap = 120, show = true) {      // returns false if something else spoke over it; show: the words too
      const my = ++token; this.halt();

    halt() { try { playing && playing.stop(); } catch (e) {} playing = null; speech.stop(); },
    stop() { token++; this.halt(); },

})();

  const rows = Math.ceil(want / cols), cw = W / cols, ch = H / rows, m = Math.floor(Math.min(104, cw * .8, ch * .8));

                   { key: '2', name: 'Medium', sub: 'mixed up', lo: 1, hi: 6, show: 1500, k: 3 },
                   { key: '3', name: 'Tricky', sub: 'two groups', lo: 6, hi: 10, show: 2200, k: 4 }];
const nqLevel = () => NQ_LEVELS.find(l => l.key === NQ.level) || NQ_LEVELS[0];
const DICE = { 1: [[.5, .5]], 2: [[.27, .27], [.73, .73]], 3: [[.22, .22], [.5, .5], [.78, .78]],
               4: [[.27, .27], [.73, .27], [.27, .73], [.73, .73]], 5: [[.25, .25], [.75, .25], [.5, .5], [.25, .75], [.75, .75]],
               6: [[.28, .2], [.28, .5], [.28, .8], [.72, .2], [.72, .5], [.72, .8]] };
function dicePts(n) {

  if (n === 6 && Math.random() < .5) p = p.map(([x, y]) => [y, x]);      // 6 stands up or lies down

}

  if (my !== LT.demoTok) return;

function lpoint(e) {

}
function drawPick() {

// ---- spell
const LS = { level: '1', word: null, letters: [], filled: 0, round: 0, queues: {}, last: null };
function nameLetters() { const n = ownerName().replace(/[^A-Za-z]/g, ''); return n.length >= 2 ? n.slice(0, 10) : ''; }
function spellLevels() {
  const L = [{ key: '1', name: '3 letters', sub: 'fox, sun' }, { key: '2', name: '4 letters', sub: 'frog, crab' }, { key: '3', name: 'Spell it', sub: 'Extra letters' }];
  if (nameLetters()) L.push({ key: 'name', name: 'My name', sub: nameLetters() });
  return L;
}
function buildSpellLevels() {
  const box = $('sLevels'), L = spellLevels(); box.textContent = '';

  if (!L.some(l => l.key === LS.level)) LS.level = '1';

    const b = document.createElement('button'); b.className = 'level'; b.type = 'button';
    b.innerHTML = '<span></span><small></small>'; b.firstChild.textContent = l.name; b.lastChild.textContent = l.sub;
    b.setAttribute('aria-pressed', String(l.key === LS.level));
    b.addEventListener('click', () => { LS.level = l.key; lstore.level = l.key; lsave(); buildSpellLevels(); newWord(); });
    box.append(b);
  });
}
function pickWord() {
  if (LS.level === 'name') return { id: isSam() ? 'sam' : null, text: nameLetters(), pic: isSam() ? 'family:sam' : null, name: true };
  const lv = l => [...(LETTER_DATA.spell[l] || []), ...(famOn() && FAMILY.spell[l] || [])];
  let pool = LS.level === '3' ? [...lv('1'), ...lv('2')] : lv(LS.level);

  let q = LS.queues[LS.level];
  if (!q || !q.length) { q = LS.queues[LS.level] = shuffleArr([...pool]); if (q[q.length - 1] === LS.last && q.length > 1) [q[0], q[q.length - 1]] = [q[q.length - 1], q[0]]; }
  const w = q.pop(); LS.last = w;

}
function newWord() {
  voice.stop(); voice.nextVoice();
  const my = ++LS.round, w = pickWord(); LS.word = w; LS.filled = 0;
  LS.letters = w.name ? [...w.text] : [...w.text.toLowerCase()];
  $('sPic').querySelector('img').src = w.pic ? picURL(w.pic) : 'faces/F01.webp';
  $('sPic').classList.remove('pop'); $('sNext').hidden = true;
  const avail = Math.max(240, $('spellBox').clientWidth - 32), n = LS.letters.length;
  const slots = $('sSlots'); slots.textContent = '';
  slots.style.setProperty('--s', Math.min(78, Math.floor((avail - (n - 1) * 8) / n)) + 'px');
  const ghost = LS.level === '1' || w.name;
  LS.letters.forEach(c => { const d = document.createElement('div'); d.className = 'slot'; d.textContent = ghost ? c : ''; slots.append(d); });
  // tiles: the word's letters, plus two that aren't in it on "Spell it"
  let tiles = [...LS.letters];
  if (LS.level === '3') {
    const pool = 'abcdefghijklmnoprstuvwz'.split('').filter(c => !LS.letters.includes(c));
    tiles.push(...shuffleArr(pool).slice(0, 2));
  }

  if (tiles.join('') === LS.letters.join('') && tiles.length > 1) tiles.push(tiles.shift());
  const cols = Math.min(tiles.length, 4), box = $('sTiles'); box.textContent = '';
  box.style.setProperty('--t', Math.min(96, Math.floor((avail - (cols - 1) * 10) / cols)) + 'px');
  tiles.forEach((c, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tile'; b.textContent = c; b.dataset.ch = c;
    b.style.background = LCOLS[i % LCOLS.length];
    b.setAttribute('aria-label', `Letter ${c.toLowerCase()}`);
    b.addEventListener('click', () => ltapTile(b));
    box.append(b);
  });
  const clips = w.name ? LS.letters.map(c => 'name_' + c.toLowerCase()) : LS.letters.map(c => 'sound_' + c);
  voice.preload([...clips, ...tiles.map(c => 'sound_' + c.toLowerCase()), w.id ? 'word_' + w.id : '', 'say_spell', 'say_listen', 'say_name', 'say_great_spelling']);
  const intro = w.name ? [SAY('name')] : LS.level === '3' ? [SAY('listen'), WORD(w.id)] : [SAY('spell'), WORD(w.id)];
  lwait(250).then(() => my === LS.round && voice.say(intro));
}
function ltapTile(btn) {
  if (LS.busy || btn.classList.contains('used')) return;
  sound.unlock();
  const c = btn.dataset.ch, need = LS.letters[LS.filled];
  voice.say([LS.word.name ? LNAME(c.toLowerCase()) : SOUND(c)]);

}
async function lfinishWord() {
  const my = LS.round; LS.busy = true;

// ---- sound hunt ("hunt": hear a sound, find its letter) and first sounds ("first": see a picture, find its first letter)
const LH = { mode: 'hunt', level: '1', round: 0, n: 0, res: [], queue: [], target: null, word: null, tries: 0, busy: false };
const LH_ROUND = 10;
const LH_SAME = { c: 'k', k: 'c' };                 // the same sound: never offered side by side
const LH_NEAR = { b: 'dp', d: 'bt', p: 'b', m: 'n', n: 'm', f: 'v', v: 'f', s: 'z', z: 's', i: 'e', e: 'i', a: 'u', u: 'ao',
                  o: 'u', g: 'c', c: 'g', k: 'g', t: 'd', w: 'r', r: 'w', l: 'r', j: 'g', h: 'f', q: 'k', x: 's', y: 'i' };
function huntLevels() { return [{ key: '1', name: 'Easy', sub: '3 letters' }, { key: '2', name: 'Tricky', sub: 'b or d?' }]; }
function buildHuntLevels() {
  const box = $('hLevels'); box.textContent = '';
  huntLevels().forEach(l => {
    const b = document.createElement('button'); b.className = 'level'; b.type = 'button';
    b.innerHTML = '<span></span><small></small>'; b.firstChild.textContent = l.name; b.lastChild.textContent = l.sub;
    b.setAttribute('aria-pressed', String(l.key === LH.level));
    b.addEventListener('click', () => { LH.level = l.key; lstore.hlevel = l.key; lsave(); buildHuntLevels(); newHuntRound(); });
    box.append(b);
  });
}
function huntChoices(t) {          // the answer plus 2 (Easy) or 3 (Tricky) others; Tricky always includes a look- or sound-alike
  const n = LH.level === '2' ? 4 : 3, out = [t];
  const clash = c => out.includes(c) || out.some(o => LH_SAME[o] === c) || c === 'x';
  if (LH.level === '2') {
    const near = [...(LH_NEAR[t] || '')].filter(c => !clash(c));
    if (near.length) out.push(near[Math.floor(Math.random() * near.length)]);
  }
  const close = new Set([...(LH_NEAR[t] || '')]);
  for (const k in LH_NEAR) if (LH_NEAR[k].includes(t)) close.add(k);
  for (const c of shuffleArr('abcdefghijklmnopqrstuvwyz'.split(''))) {
    if (out.length >= n) break;
    if (clash(c) || close.has(c)) continue;
    out.push(c);
  }

}
const huntWord = ch => ch === 'x' ? null : letterWord(ch).id;   // box starts with b, so x gets no word
const lhClip = (prefix, id) => [prefix + id, ''];                // a clip with no words on screen (they'd give the answer away)
function drawHuntDots(id = 'hDots') {
  const box = $(id); box.textContent = '';
  for (let i = 0; i < LH.queue.length; i++) { const d = document.createElement('i'); if (LH.res[i]) d.className = LH.res[i]; box.append(d); }
}
function newHuntRound() {
  LH.n = 0; LH.res = []; $('hEnd').hidden = true; $('hTiles').hidden = false; $('hDots').hidden = false; $('huntBox').classList.remove('ended');
  if (LH.mode === 'hunt') LH.queue = shuffleArr('abcdefghijklmnopqrstuvwxyz'.split('')).slice(0, LH_ROUND);
  else {
    const words = Object.keys(LETTER_DATA.words).filter(w => isSam() || !LETTER_DATA.words[w].pic.startsWith('family:'));
    const seen = new Set(); LH.queue = [];
    for (const w of shuffleArr(words)) {
      const c = LETTER_DATA.words[w].text[0].toLowerCase();
      if (c === 'x' || seen.has(c)) continue;
      seen.add(c); LH.queue.push(w); if (LH.queue.length === LH_ROUND) break;
    }
  }
  drawHuntDots(); huntNext();
}
function huntNext() {
  voice.stop(); voice.nextVoice();
  const my = ++LH.round; LH.tries = 0; LH.busy = false;
  if (LH.n >= LH.queue.length) return huntEnd();
  if (LH.mode === 'hunt') { LH.target = LH.queue[LH.n]; LH.word = null; }
  else { LH.word = { id: LH.queue[LH.n], ...LETTER_DATA.words[LH.queue[LH.n]] }; LH.target = LH.word.text[0].toLowerCase(); }
  $('hHear').hidden = LH.mode !== 'hunt'; $('hPic').hidden = LH.mode !== 'first';
  if (LH.word) { const img = $('hPic').querySelector('img'); img.src = picURL(LH.word.pic); $('hPic').classList.remove('pop'); }
  const ch = huntChoices(LH.target), box = $('hTiles'); box.textContent = '';
  const avail = Math.max(240, $('huntBox').clientWidth - 32);
  let t = Math.floor((avail - (ch.length - 1) * 10) / ch.length), perRow = ch.length;
  if (t < 84 && ch.length === 4) { perRow = 2; t = Math.floor((avail - 10) / 2); }   // a phone: 2 x 2, so each letter stays thumb-sized
  t = Math.min(perRow === 2 ? 104 : 112, t);
  box.style.setProperty('--t', t + 'px'); box.style.maxWidth = (perRow * t + (perRow - 1) * 10 + 2) + 'px'; box.style.marginInline = 'auto';
  ch.forEach((c, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tile'; b.textContent = c; b.dataset.ch = c;
    b.style.background = LCOLS[i % LCOLS.length]; b.setAttribute('aria-label', `Letter ${c}`);
    b.addEventListener('click', () => huntTap(b));
    box.append(b);
  });
  const w = huntWord(LH.target);
  voice.preload(['sound_' + LH.target, LH.word ? 'word_' + LH.word.id : '', w ? 'word_' + w : '', 'say_which', 'say_starts', 'say_well_done']);
  lwait(300).then(() => my === LH.round && huntPrompt(LH.n === 0));
}
function huntPrompt(withQuestion) {      // the question (first one of a round only), then the sound or the word
  const ask = LH.mode === 'hunt' ? SAY('which') : SAY('starts');
  const it = LH.mode === 'hunt' ? lhClip('sound_', LH.target) : lhClip('word_', LH.word.id);

}
function huntTap(btn) {
  if (LH.busy || btn.classList.contains('yes')) return;
  sound.unlock();
  const c = btn.dataset.ch, my = LH.round;
  if (c === LH.target) {

    [...$('hTiles').children].forEach(b => b !== btn && b.classList.add('dim'));
    LH.res[LH.n] = LH.tries ? 'miss' : 'hit'; drawHuntDots();
    if (LH.word) { $('hPic').classList.remove('pop'); void $('hPic').offsetWidth; $('hPic').classList.add('pop'); }
    const w = LH.word ? LH.word.id : huntWord(c);

    LH.tries++; btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope');

  const hits = LH.res.filter(r => r === 'hit').length;

}

const LMODES = { trace: 'lmTrace', spell: 'lmSpell', hunt: 'lmHunt', first: 'lmFirst' };
function letterMode(m) {
  if (!LMODES[m]) m = 'trace';
  lstore.mode = m; lsave();
  for (const k in LMODES) $(LMODES[k]).setAttribute('aria-pressed', String(m === k));
  $('traceBox').hidden = m !== 'trace'; $('spellBox').hidden = m !== 'spell'; $('huntBox').hidden = m !== 'hunt' && m !== 'first';
  voice.stop(); LT.demoTok++; LT.demoing = false; LS.round++; LS.busy = false; LH.round++; LH.busy = false;
  if (m === 'trace') setLetter(LT.ch || lstore.next || 'a');

async function openLetters() {
  show('lettergame');
  await Promise.all([voice.load(), loadFamily()]); voice.nextVoice();
  LT.ch = lstore.next || 'a'; LS.level = lstore.level || '1';

}
function stopLetters() { voice.stop(); LT.demoTok++; LT.demoing = false; LT.down = false; LS.round++; LS.busy = false; LH.round++; LH.busy = false; }
function buildLetters() {
  const svg = $('tSvg');
  svg.addEventListener('pointerdown', ltraceDown);
  svg.addEventListener('pointermove', ltraceMove);
  svg.addEventListener('pointerup', ltraceUp);
  svg.addEventListener('pointercancel', ltraceUp);
  $('tWatch').addEventListener('click', () => { sound.unlock(); ldemo(); });
  $('tAgainL').addEventListener('click', () => setLetter(LT.ch));
  $('tNext').addEventListener('click', () => { const a = 'abcdefghijklmnopqrstuvwxyz'; setLetter(a[(a.indexOf(LT.ch) + 1) % 26]); });
  $('tPic').addEventListener('click', () => { sound.unlock(); voice.say([WORD(LT.word.id)]); });
  $('tPickOpen').addEventListener('click', () => { const b = $('tPick'); b.hidden = !b.hidden; $('tPickOpen').setAttribute('aria-expanded', String(!b.hidden)); });
  $('sPic').addEventListener('click', () => { sound.unlock(); if (LS.word && LS.word.id) voice.say([WORD(LS.word.id)]); });
  $('sNext').addEventListener('click', newWord);
  $('lmTrace').addEventListener('click', () => letterMode('trace'));
  $('lmSpell').addEventListener('click', () => letterMode('spell'));
  $('lmHunt').addEventListener('click', () => letterMode('hunt'));
  $('lmFirst').addEventListener('click', () => letterMode('first'));
  $('hHear').addEventListener('click', () => { sound.unlock(); if (!LH.busy) huntPrompt(false); });
  $('hPic').addEventListener('click', () => { sound.unlock(); if (!LH.busy) huntPrompt(false); });

}

// ------------------------------------------------------------- wiring ----
function init() {
  if (hopping) return;
  renderTitle();
  $('playLetters').addEventListener('click', () => openGame('lettergame'));
  $('playCount').addEventListener('click', () => openGame('countgame'));
  $('playQuick').addEventListener('click', () => openGame('quickgame'));
  buildLetters();
  buildNumbers();
  if (!lettersOK()) { $('playLetters').hidden = true; $('lettersHead').hidden = true; }
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => openGame(b.dataset.go)));
  document.querySelectorAll('.mute').forEach(b => b.addEventListener('click', () => { sound.set(!sound.on); syncMute(); if (!sound.on) { voice.stop(); nvoice.stop(); } }));
